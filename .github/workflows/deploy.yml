name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rendydev404/adb-live-preview:latest
            ghcr.io/rendydev404/adb-live-preview:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rendydev404/ADB-LIVE-PREVIEW
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Forks build the image but have no server to deploy to.
    if: github.repository == 'rendydev404/ADB-LIVE-PREVIEW'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy on VPS
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the VPS to deploy/redeploy.sh, so no command is sent.
          ssh -i ~/.ssh/id_ed25519 "root@$SSH_HOST" true
